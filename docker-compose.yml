services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: blog_platform
      POSTGRES_USER: blog_platform
      POSTGRES_PASSWORD: blog_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog_platform -d blog_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
